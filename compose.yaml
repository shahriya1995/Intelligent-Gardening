services:
  gardener-api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      GARDEN_DB_PATH: /data/garden.db
      GARDEN_API_KEY: ${GARDEN_API_KEY:-change-me}
      GARDEN_TIMEZONE: ${GARDEN_TIMEZONE:-America/Los_Angeles}
    volumes:
      - gardener-data:/data
    ports:
      - "8100:8000"
    restart: unless-stopped

  gardener-mcp:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "apps/server/dist/src/mcp-http.js"]
    environment:
      GARDEN_DB_PATH: /data/garden.db
      GARDEN_TIMEZONE: ${GARDEN_TIMEZONE:-America/Los_Angeles}
    volumes:
      - gardener-data:/data
    ports:
      - "8101:8001"
    restart: unless-stopped

  gardener-reminders:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "apps/server/dist/src/reminder-worker.js"]
    profiles: ["reminders"]
    environment:
      GARDEN_DB_PATH: /data/garden.db
      GARDEN_TIMEZONE: ${GARDEN_TIMEZONE:-America/Los_Angeles}
      OPEN_WEBUI_REMINDER_WEBHOOK_URL: ${OPEN_WEBUI_REMINDER_WEBHOOK_URL:-}
    volumes:
      - gardener-data:/data
    depends_on:
      - open-webui
    restart: unless-stopped
  gardener-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - gardener-api
    ports:
      - "5200:80"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["open-webui"]
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-replace-me-before-production}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - gardening-open-webui-data:/app/backend/data
    ports:
      - "5000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  gardener-data:
  gardening-open-webui-data:
